name: 3. Update Songs from Last.fm

on:
  schedule:
    # Run daily at 5:45 AM UTC (after albums update)
    - cron: '45 5 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Needed to commit/push the updated database

jobs:
  update-songs:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📁 Create data directory
        run: mkdir -p data

      - name: 🎵 Run song database update
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USER: ${{ secrets.LASTFM_USER }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python script/3_song_db_raw.py

      - name: 📤 Upload song database as artifact
        uses: actions/upload-artifact@v4
        with:
          name: songs-database-raw
          path: data/3_songs_raw.db
          retention-days: 7

      - name: 💾 Commit and push database
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/3_songs_raw.db
          git diff --staged --quiet || git commit -m "Actualizar 3_songs_raw.db con canciones de Last.fm [skip ci]"
          git push
