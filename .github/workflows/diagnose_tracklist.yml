name: 🔬 Diagnose - MusicBrainz Tracklist

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install musicbrainzngs

      - name: 🔬 Run diagnostic
        run: python script/diagnose_tracklist.py
