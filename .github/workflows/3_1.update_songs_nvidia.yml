name: 3b. Update Songs from Last.fm (NVIDIA - free tier)

on:
  workflow_dispatch:  # Manual trigger only — meant for the initial bulk run

permissions:
  contents: write  # Needed to commit/push the updated database

jobs:
  update-songs-nvidia:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📁 Create data directory
        run: mkdir -p data

      - name: 🎵 Run song database update (NVIDIA)
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USER: ${{ secrets.LASTFM_USER }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python script/3_song_db_raw_nvidia.py

      - name: 💾 Commit and push database
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/3_songs_raw.db
          git diff --staged --quiet || git commit -m "Actualizar 3_songs_raw.db (NVIDIA) [skip ci]"
          git push
