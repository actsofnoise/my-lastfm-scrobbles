name: 3. Update Songs from Last.fm

on:
  schedule:
    - cron: '30 5 * * *'  # 5:30 AM UTC (after artists update)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-songs:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📁 Create data directory
        run: mkdir -p data

      - name: 🎵 Run song database update
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USER: ${{ secrets.LASTFM_USER }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python script/2_song_db_raw.py

      - name: 💾 Commit and push song database
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/2_songs_raw.db
          git diff --staged --quiet || git commit -m "Actualizar 2_songs_raw.db con canciones [skip ci]"
          git push

      - name: 📤 Upload song database as artifact
        uses: actions/upload-artifact@v4
        with:
          name: songs-database-raw
          path: data/2_songs_raw.db
          retention-days: 7
